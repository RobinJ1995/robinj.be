server {
  listen 80;
  server_name _;

  root /var/www/;
  index index.html;

  # Every route is prerendered to a static file, so an unknown URL is a genuine
  # 404 (served with the prerendered 404 page, not a soft-404 / SPA fallback).
  error_page 404 /404.html;

  # Old URLs from before the Side Quests rename.
  location ~ ^/projects(/source)?/?$ {
    absolute_redirect off;
    return 301 /side-quests$1;
  }

  location / {
    try_files $uri $uri/index.html =404;
    tcp_nodelay on;
  }

  location ~* \.(jpg|jpeg|png|gif|webp|svg|ico|css|js)$ {
    expires 100d;
  }
}
